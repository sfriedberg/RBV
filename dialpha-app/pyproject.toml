[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dialpha"
version = "0.1.0"
description = "Local desktop app: extract deal patterns, score alpha signals, run weekly reports"
authors = [{name = "Stephen Friedberg", email = "stephen@rockbrookventures.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "reportlab>=4.0",
    "pandas>=2.2",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "apscheduler>=3.10",
]

[project.scripts]
dialpha = "dialpha.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]
